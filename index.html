<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Task<span class="accent">Master</span></h1>
        <p class="subtitle">Gestion de tâches typée en TypeScript</p>
      </header>

      <main>
        <form id="taskForm" class="input-group">
          <input
            type="text"
            id="taskHolder"
            placeholder="Quelle est la prochaine étape ?"
            required
          />
          <select id="prioritySelect">
            <option value="low">Faible</option>
            <option value="mid">Moyenne</option>
            <option value="hardest">Haute</option>
          </select>
          <button type="submit" id="addBtn">Ajouter</button>
        </form>

        <section class="list-container">
          <div class="list-header">
            <span id="taskCount">0 tâches</span>
          </div>
          <ul id="taskList"></ul>
        </section>
      </main>
    </div>
    <script src="index.js"></script>
  </body>
</html>
